name: pmo-prod-stack

services:
  # Serviço Principal (pmo-bot-go)
  # Ultra-leve graças à compilação estática de Go e gestão eficiente de memória.
  pmo-bot-go:
    build:
      context: ./pmo-bot-go
    restart: always
    env_file:
      - .env.prod
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - pmo_prod_net
    depends_on:
      - evolution-go
      - redis

  # Serviço do Motor de WhatsApp (evolution-go)
  # A versão em Go da Evolution API permite limites de RAM drasticaamente inferiores ao Node.js.
  evolution-go:
    build:
      context: ./evolution-go-source
    restart: always
    env_file:
      - .env.prod
    environment:
      # Override db paths to explicit /data directory which is bind-mounted to the host
      DATABASE_CONNECTION_URI: file:/data/sqlite.db?_foreign_keys=on
      POSTGRES_AUTH_DB: file:/data/auth.db?_pragma=foreign_keys(1)&_busy_timeout=5000&cache=shared&mode=rwc&_journal_mode=WAL
      POSTGRES_USERS_DB: file:/data/users.db?_foreign_keys=on
      WHATSAPP_VERSION_MAJOR: "2"
      WHATSAPP_VERSION_MINOR: "3000"
      WHATSAPP_VERSION_PATCH: "1044142122"
    ports:
      - "8082:8082"
    volumes:
      # Bind-mount to host directory: session survives container rebuilds
      - ./evolution_data:/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - pmo_prod_net

  # Serviço de Cache (Redis)
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - pmo_prod_net

networks:
  pmo_prod_net:
    driver: bridge

volumes:
  redis_data:
