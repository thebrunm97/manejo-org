name: pmo-prod-stack

services:
  # Serviço Principal (pmo-bot-go)
  # Ultra-leve graças à compilação estática de Go e gestão eficiente de memória.
  # Sentinela de Clock Drift (DT-26).
  #
  # ATENÇÃO — este serviço MEDE, não corrige. A tentativa anterior de corrigir
  # daqui não funcionava: o relógio autoritativo é o do Windows, e o Hyper-V
  # TimeSync reimpõe esse horário na VM do Docker, desfazendo qualquer ajuste
  # feito dentro do contêiner. O log dizia "setting time" a cada 30s enquanto o
  # offset só crescia (+4,8s → +5,4s em três minutos), mascarando o problema.
  #
  # A correção de verdade é no host: o serviço W32Time do Windows estava PARADO
  # (trigger-start por ingresso em domínio, que nunca ocorre nesta máquina), de
  # modo que o Windows jamais sincronizava. Ver docs/debitos_tecnicos.md DT-26.
  #
  # Mantido como sentinela porque o drift já derrubou 100% dos downloads de
  # mídia do WhatsApp (403) uma vez; um alerta explícito é o que permite
  # perceber a recorrência antes do usuário.
  clockwork:
    image: alpine:latest
    restart: always
    # Mantido deliberadamente simples: lógica de limiar dentro de escalar YAML
    # vira um emaranhado de escapes que já quebrou uma vez em produção. Aqui só
    # se mede e imprime; a classificação fica em scripts/analisar_telemetria.sh,
    # onde é testável.
    command:
      - sh
      - -c
      - while true; do busybox ntpd -n -q -w -p time.google.com 2>&1 | busybox grep -o 'offset:[+-][0-9.]*' | busybox tail -1; sleep 60; done
    networks:
      - pmo_prod_net

  # Motor de Text-to-Speech (Piper) — auto-hospedado, gratuito e sem cota.
  # Expõe uma API compatível com OpenAI (POST /v1/audio/speech), que é o mesmo
  # protocolo falado por Groq/OpenRouter — por isso o bot usa um único cliente
  # para todos (ver internal/tts/openai_compat.go).
  #
  # A voz é baixada do HuggingFace no primeiro uso e fica no volume piper_data,
  # então só o primeiro pedido é lento. Vozes pt-BR disponíveis: faber, cadu,
  # edresson, jeff — trocar via TTS_PIPER_VOICE em .env.prod.
  piper:
    image: kamilkrawiec/piper-openai-tts:latest
    restart: always
    environment:
      - DATA_DIR=/data
      - PORT=5000
    volumes:
      - piper_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - pmo_prod_net

  pmo-bot-go:
    build:
      context: ./pmo-bot-go
    restart: always
    env_file:
      - .env.prod
    environment:
      # Endereço do Redis na rede interna do compose. Vive aqui, e não no
      # .env.prod, porque é topologia da stack e não segredo.
      # Sem esta variável o bot sobe com rate limiting DESLIGADO (ver
      # internal/ports/ratelimit.go).
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
    cap_add:
      - SYS_TIME
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./pmo-bot-go/.secrets:/.secrets:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # Só localhost: o único consumidor externo é o túnel ngrok, que roda
      # como agente na própria máquina e fala com 127.0.0.1:8080 — não
      # precisa (e não deve) da porta publicada em 0.0.0.0, onde qualquer
      # outro dispositivo da rede local também alcançaria a API crua sem
      # passar pelo túnel. Isso é camada extra: quem protege de fato o
      # webhook contra a internet, que o ngrok expõe sem distinguir rota, é
      # o token no header Authorization (ver internal/webhook/handler.go).
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - pmo_prod_net
    # Forma de mapa (e não lista) por causa do redis: a conexão é feita UMA vez,
    # na subida. Se o Redis ainda não aceitasse conexão nesse instante, o bot
    # degradaria aberto e ficaria sem rate limiting até o próximo restart —
    # esperar o healthcheck é o que fecha essa janela.
    depends_on:
      evolution-go:
        condition: service_started
      redis:
        condition: service_healthy
      clockwork:
        condition: service_started
      piper:
        condition: service_started

  # Serviço do Motor de WhatsApp (evolution-go)
  # A versão em Go da Evolution API permite limites de RAM drasticaamente inferiores ao Node.js.
  evolution-go:
    build:
      context: ./evolution-go-source
    restart: always
    env_file:
      - .env.prod
    cap_add:
      - SYS_TIME
    environment:
      # Override db paths to explicit /data directory which is bind-mounted to the host
      DATABASE_CONNECTION_URI: file:/data/sqlite.db?_foreign_keys=on
      POSTGRES_AUTH_DB: file:/data/auth.db?_pragma=foreign_keys(1)&_busy_timeout=5000&cache=shared&mode=rwc&_journal_mode=WAL
      POSTGRES_USERS_DB: file:/data/users.db?_foreign_keys=on
      WHATSAPP_VERSION_MAJOR: "2"
      WHATSAPP_VERSION_MINOR: "3000"
      WHATSAPP_VERSION_PATCH: "1044142122"
      AMQP_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/default"
      RABBITMQ_ENABLED: "true"
      RABBITMQ_GLOBAL_ENABLED: "true"
      AMQP_SPECIFIC_EVENTS: "messages.upsert,messages.update"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      # Bind-mount to host directory: session survives container rebuilds
      - ./evolution_data:/data
      - /etc/localtime:/etc/localtime:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - pmo_prod_net
    depends_on:
      - clockwork

  # Serviço de Cache (Redis)
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pmo_prod_net

  # Serviço de Mensageria (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      # Só localhost: nada externo precisa falar AMQP/management diretamente;
      # os consumidores (pmo-bot-go, evolution-go) estão na rede interna do
      # compose. Evita expor o broker (e seu painel de admin) para a internet.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pmo_prod_net


  # Fase 3 — proxy reverso publico com TLS automatico (Let's Encrypt).
  # Unico servico com portas realmente publicas (80/443); tudo o resto na
  # rede pmo_prod_net so fala 127.0.0.1 no host. Ver deploy/Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: always
    env_file:
      - .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pmo_prod_net
    depends_on:
      - pmo-bot-go

networks:
  pmo_prod_net:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
  # Cache das vozes do Piper baixadas do HuggingFace — evita rebaixar a cada
  # restart do container (a voz pt-BR tem alguns dezenas de MB).
  piper_data:
