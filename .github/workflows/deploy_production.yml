name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  # Project ref não é segredo (aparece na própria URL do dashboard) — só o
  # access token e a senha do banco (abaixo, via secrets) são sensíveis.
  SUPABASE_PROJECT_ID: hejewayflbuemnffrhae
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  verify_schema_parity:
    name: Verify Schema Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Production Project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      # Compara as migrations locais contra o schema real do banco de
      # produção (linkado acima), garantindo que não há diferença estrutural
      # antes do push.
      - name: Verify Migrations (Prod vs Local)
        run: supabase db diff --linked

  deploy:
    name: Deploy Migrations to Production
    runs-on: ubuntu-latest
    needs: verify_schema_parity
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Production Project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      # --include-all é temporário: existe uma migration (20260825020000) com
      # timestamp anterior à última já registrada como aplicada, resultado de
      # ter corrigido um registro fantasma no histórico (ver commit da
      # migration 20260906210000_multicanal_a1_channel_links.sql). Sem a
      # flag, a CLI recusa por segurança migrations "fora de ordem". Depois
      # deste catch-up passar, REMOVER a flag num commit seguinte — deixá-la
      # permanente esconderia futuros casos reais de migration fora de ordem.
      - name: Push Migrations
        run: supabase db push --include-all
