name: Backend E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'pmo-bot-go/**'
      - '.github/workflows/backend-e2e.yml'

jobs:
  e2e-test:
    name: Run E2E Tests (Supabase + LLM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmo-bot-go

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: pmo-bot-go/go.sum

      - name: Run E2E Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go test -v -tags=e2e ./e2e/...
