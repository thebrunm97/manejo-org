name: Secret Scan

# Escaneia APENAS os commits novos do push/PR -- nao a historia inteira.
#
# Por que so o diff: os vazamentos ja conhecidos (DT-01 service_role key +
# SUPABASE_ACCESS_TOKEN, DT-45 Evolution API key) continuam na historia deste
# repositorio publico e so somem com reescrita de historico. Um scan de
# historia completa ficaria vermelho para sempre, e um job cronicamente
# vermelho e um job que todo mundo aprende a ignorar. Este job bloqueia
# vazamentos NOVOS; os antigos seguem rastreados em DT-01 e DT-45.
#
# Para auditar a historia inteira sob demanda (localmente):
#   gitleaks git . --config .gitleaks.toml --redact

on:
  pull_request:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (diff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com historico
        uses: actions/checkout@v4
        with:
          # Necessario para que o range base..head exista localmente.
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          # Versao fixa de proposito: um `latest` faz o gate mudar de
          # comportamento sozinho, e regra nova quebrando build alheio e a
          # forma mais rapida de a equipe desativar o scan.
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determinar range de commits
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'
            LOG_OPTS="--no-merges ${BASE}...${HEAD}"
          else
            BEFORE='${{ github.event.before }}'
            # Branch novo (ou push forcado) vem com before = 000...0.
            if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              LOG_OPTS="--no-merges -1 ${{ github.sha }}"
            else
              LOG_OPTS="--no-merges ${BEFORE}..${{ github.sha }}"
            fi
          fi
          echo "log_opts=${LOG_OPTS}" >> "$GITHUB_OUTPUT"
          echo "Escaneando: git log ${LOG_OPTS}"

      - name: Rodar gitleaks
        run: |
          set -euo pipefail
          # --redact e obrigatorio aqui: este repositorio e PUBLICO e os logs
          # do Actions sao legiveis por qualquer pessoa. Sem isso, um segredo
          # detectado seria reimpresso em um lugar ainda mais visivel que o
          # commit que o trouxe.
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "${{ steps.range.outputs.log_opts }}" \
            --redact \
            --no-banner \
            --platform github \
            --exit-code 1

      - name: Orientacao em caso de falha
        if: failure()
        run: |
          cat <<'MSG'
          ============================================================
          Segredo detectado nos commits deste PR/push.

          Os valores acima estao redigidos de proposito -- os logs deste
          repositorio publico sao legiveis por qualquer pessoa.

          1. Trate a credencial como JA COMPROMETIDA e rotacione-a.
             Apagar a linha nao basta: o valor fica no reflog, em forks,
             em clones e em caches de terceiros.
          2. Remova o valor do codigo e leia de variavel de ambiente.
          3. Falso positivo? Ajuste .gitleaks.toml ([[allowlists]]) para
             padroes recorrentes, ou .gitleaksignore para casos unicos.
             Sempre com uma justificativa escrita ao lado.

          Detalhes e racional: docs/security/secret-scanning.md
          ============================================================
          MSG
