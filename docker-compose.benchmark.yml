services:
  redis:
    image: redis:alpine
    container_name: benchmark-redis
    networks:
      - benchmark-net

  bot-go:
    container_name: bot-go-benchmark
    build:
      context: ./pmo-bot-go
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "8081:8080"
    env_file:
      - ./pmo-bot-go/.env
    environment:
      - PORT=8080
      - WPPCONNECT_URL=http://benchmark-runner:3333
      - GIN_MODE=release
      - MOCK_WHATSAPP=true
      - WPPCONNECT_TOKEN=benchmark_secret
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - benchmark-net

  benchmark-runner:
    container_name: benchmark-runner
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    environment:
      - GO_BOT_URL=http://bot-go:8080
    ports:
      - "3333:3333"
    networks:
      - benchmark-net

networks:
  benchmark-net:
    driver: bridge
