name: pmo-captest

# DT-53 / apoio ao teste de capacidade do DT-38.
#
# Só o Piper, isolado, com os MESMOS limites de CPU/memória do serviço
# equivalente em docker-compose.prod.yml (1 vCPU / 1G). Objetivo: validar em
# hardware de nuvem real os números já medidos localmente (~5,2s fixos +
# 0,037s por caractere, com 1 vCPU) — ver DT-38 em docs/debitos_tecnicos.md.
#
# Deliberadamente NÃO inclui evolution-go nem pmo-bot-go: não toca WhatsApp,
# não precisa de EVOLUTION_API_KEY nem de nenhuma credencial real (o Piper é
# o único passo do pipeline que consome CPU local — os demais são limitados
# por rede). Descartável: sobe e derruba junto com a sessão de teste, sem
# relação com a stack de produção.
#
# NOTA HONESTA: rodando local (Docker Desktop/WSL2) em vez de numa VPS real,
# isto reproduz a MESMA metodologia que já gerou os números do DT-38 (mesmo
# teto de cpus:'1.0', mesma máquina) — é um bom ensaio da ferramenta e do
# compose, mas não substitui medir em hardware de nuvem de verdade (scheduler
# e "vizinhos barulhentos" são diferentes). Serve para validar a mecânica
# antes de gastar dinheiro numa VPS, não para fechar o dimensionamento final.
#
# Uso local (porta só em loopback, o Piper não tem autenticação embutida):
#   docker compose -f docker-compose.captest.yml up -d
#   cd pmo-bot-go/cmd/loadtest_piper
#   go run . -workers 5 -url http://localhost:5001/v1/audio/speech
#
# Porta host 5001 (não 5000): o pmo-prod-stack-piper-1 REAL já está rodando
# nesta máquina e ocupando 5000 — ver achado registrado no chat sobre o
# mapeamento de porta que o docker-compose.prod.yml diz não ter mas o
# container em execução ainda tem (stale, não foi recriado após a edição).

services:
  piper:
    image: kamilkrawiec/piper-openai-tts:latest
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - PORT=5000
    volumes:
      - piper_data:/data
    ports:
      - "127.0.0.1:5001:5000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  piper_data:
